<text text-anchor="middle" x="178" y="-794.84" font-family="Helvetica,sans-Serif" font-size="11.00">2 · ESTIMAR LA DEMANDA</text>
<text text-anchor="middle" x="178" y="-782.84" font-family="Helvetica,sans-Serif" font-size="11.00">¿cuánto se va a vender por día?</text>
<text text-anchor="middle" x="178" y="-770.84" font-family="Helvetica,sans-Serif" font-size="11.00">la IA lee las ventas y busca patrones</text>
<text text-anchor="middle" x="178" y="-758.84" font-family="Helvetica,sans-Serif" font-size="11.00">(fines de semana, rachas, picos)</text>
<text text-anchor="middle" x="178" y="-746.84" font-family="Helvetica,sans-Serif" font-size="11.00">· si las ventas son estables, basta</text>
<text text-anchor="middle" x="178" y="-734.84" font-family="Helvetica,sans-Serif" font-size="11.00">el promedio — regla: la IA solo</text>
<text text-anchor="middle" x="178" y="-722.84" font-family="Helvetica,sans-Serif" font-size="11.00">donde aporta criterio</text>
</g>
