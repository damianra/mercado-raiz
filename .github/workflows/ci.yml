name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # vitest raíz globa harness-langgraph/tests/** (deps: zod, langchain)
      - run: npm ci
        working-directory: harness-langgraph
      - run: npm audit --audit-level=critical
      - run: npm test
