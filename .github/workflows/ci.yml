name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # SPEC-25: la suite corre contra Postgres real — service
    # container con la base de test que espera db.js por default.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mercadoraiz
          POSTGRES_PASSWORD: dev-local-2026
          POSTGRES_DB: mercadoraiz-db-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercadoraiz -d mercadoraiz-db-test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # vitest raíz globa harness-langgraph/tests/** (deps: zod, langchain)
      - run: npm ci
        working-directory: harness-langgraph
      - run: npm audit --audit-level=critical
      - run: npm test
